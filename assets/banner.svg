<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#141829" />
    </linearGradient>

    <linearGradient id="mesh-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#a5b4fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="badge-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .pulse-circle {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .flow-line {
        stroke-dasharray: 8 12;
        animation: dash 12s linear infinite;
      }
      .node-glow {
        animation: nodePulse 3s ease-in-out infinite alternate;
      }
      .pill-float {
        animation: floatPill 6s ease-in-out infinite alternate;
      }
      .pill-float-reverse {
        animation: floatPillRev 7s ease-in-out infinite alternate;
      }
      @keyframes dash {
        to {
          stroke-dashoffset: -200;
        }
      }
      @keyframes pulse {
        0% { transform: scale(0.98); opacity: 0.35; }
        100% { transform: scale(1.05); opacity: 0.7; }
      }
      @keyframes nodePulse {
        0% { opacity: 0.4; r: 4; }
        50% { opacity: 1; r: 6.5; }
        100% { opacity: 0.5; r: 4; }
      }
      @keyframes floatPill {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
      @keyframes floatPillRev {
        0% { transform: translateY(0px); }
        100% { transform: translateY(8px); }
      }
      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="380" rx="16" fill="url(#bg-grad)" />

  <!-- Animated Ambient Glow Blobs in Background -->
  <g opacity="0.45">
    <circle cx="200" cy="90" r="140" fill="#6366f1" filter="url(#glow)" class="pulse-circle" style="transform-origin: 200px 90px;" />
    <circle cx="1020" cy="280" r="160" fill="#06b6d4" filter="url(#glow)" class="pulse-circle" style="transform-origin: 1020px 280px; animation-delay: -2s;" />
    <circle cx="950" cy="80" r="120" fill="#ec4899" filter="url(#glow)" class="pulse-circle" style="transform-origin: 950px 80px; animation-delay: -3s;" />
  </g>

  <!-- Technical Grid and Neural Network Flow Lines (Background Layers) -->
  <g opacity="0.25">
    <path d="M0,70 L1200,70 M0,140 L1200,140 M0,210 L1200,210 M0,280 L1200,280 M0,350 L1200,350" stroke="#334155" stroke-width="1" stroke-dasharray="3 6" />
    <path d="M150,0 L150,380 M350,0 L350,380 M550,0 L550,380 M750,0 L750,380 M950,0 L950,380 M1150,0 L1150,380" stroke="#334155" stroke-width="1" stroke-dasharray="3 6" />
  </g>

  <!-- Dynamic Animated AutoML Pipeline Flow (Behind Text Layer) -->
  <g>
    <!-- Wave / Pipeline tracks -->
    <path class="flow-line" d="M -50,310 C 250,230 450,360 750,290 C 950,240 1100,320 1250,270" fill="none" stroke="#6366f1" stroke-width="2.5" opacity="0.6" />
    <path class="flow-line" d="M -50,110 C 300,170 500,40 800,120 C 1000,180 1150,90 1250,130" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.5" style="animation-duration: 9s;" />
    <path class="flow-line" d="M -50,220 C 350,290 600,160 850,240 C 1050,310 1150,220 1250,240" fill="none" stroke="#a855f7" stroke-width="1.8" opacity="0.45" style="animation-duration: 15s;" />

    <!-- Animated Data Pipeline Nodes -->
    <circle cx="160" cy="275" r="5" fill="#38bdf8" filter="url(#soft-glow)" class="node-glow" style="animation-delay: 0.2s;" />
    <circle cx="380" cy="285" r="5" fill="#a855f7" filter="url(#soft-glow)" class="node-glow" style="animation-delay: 1.1s;" />
    <circle cx="680" cy="305" r="5" fill="#ec4899" filter="url(#soft-glow)" class="node-glow" style="animation-delay: 0.7s;" />
    <circle cx="920" cy="255" r="5" fill="#38bdf8" filter="url(#soft-glow)" class="node-glow" style="animation-delay: 1.8s;" />
    <circle cx="1080" cy="300" r="5" fill="#6366f1" filter="url(#soft-glow)" class="node-glow" style="animation-delay: 0.4s;" />
  </g>

  <!-- Floating Dynamic Tech Tags (Placed in margins so title is 100% visible) -->
  <g class="pill-float font-sans">
    <!-- Top-Right Tag: No-Code ML -->
    <g transform="translate(930, 32)">
      <rect width="145" height="30" rx="15" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" opacity="0.9" />
      <circle cx="16" cy="15" r="4" fill="#38bdf8" />
      <text x="28" y="19" fill="#e2e8f0" font-size="12" font-weight="600">⚡ No-Code ML</text>
    </g>
  </g>

  <g class="pill-float-reverse font-sans">
    <!-- Bottom-Right Tag: Open-Source -->
    <g transform="translate(970, 315)">
      <rect width="165" height="30" rx="15" fill="#1e293b" stroke="#10b981" stroke-width="1.5" opacity="0.9" />
      <circle cx="16" cy="15" r="4" fill="#10b981" />
      <text x="28" y="19" fill="#e2e8f0" font-size="12" font-weight="600">🚀 Open-Source Hub</text>
    </g>
    <!-- Bottom-Left Tag: Automated Pipelines -->
    <g transform="translate(65, 315)">
      <rect width="195" height="30" rx="15" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" opacity="0.9" />
      <circle cx="16" cy="15" r="4" fill="#ec4899" />
      <text x="28" y="19" fill="#e2e8f0" font-size="12" font-weight="600">🤖 Automated Pipelines</text>
    </g>
  </g>

  <!-- FOREGROUND CONTENT: Header Pill, Title, Subtitle, Highlights -->
  <!-- Crisp overlay backdrop behind text to ensure zero collision with background elements -->
  <rect x="70" y="45" width="1060" height="255" rx="14" fill="#0b1120" fill-opacity="0.4" />

  <!-- Top Pill / Category -->
  <g transform="translate(85, 60)" class="font-sans">
    <rect width="320" height="28" rx="14" fill="url(#badge-glow)" opacity="0.25" />
    <rect width="320" height="28" rx="14" fill="none" stroke="#6366f1" stroke-width="1" />
    <circle cx="16" cy="14" r="4" fill="#22c55e" />
    <text x="28" y="18" fill="#c7d2fe" font-size="11.5" font-weight="700" letter-spacing="1">✨ CURATED AWESOME ECOSYSTEM</text>
  </g>

  <!-- Title (Foreground, high contrast) -->
  <g class="font-sans">
    <text x="85" y="145" font-size="44" font-weight="800" fill="url(#title-grad)" letter-spacing="-0.8">
      Awesome AutoML &amp; Low-Code ML
    </text>
  </g>

  <!-- Subtitle -->
  <g class="font-sans">
    <text x="85" y="188" font-size="19" font-weight="500" fill="#cbd5e1" letter-spacing="0.1">
      Curated List of SaaS Platforms, Automated Feature Engineering &amp; Open-Source Toolkits
    </text>
  </g>

  <!-- Value Propositions / Feature Badges in Foreground -->
  <g transform="translate(85, 222)" class="font-sans">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="180" height="32" rx="8" fill="#1e1b4b" stroke="#4338ca" stroke-width="1.2" />
    <text x="14" y="21" fill="#a5b4fc" font-size="13" font-weight="600">📊 Enterprise SaaS</text>

    <!-- Tag 2 -->
    <rect x="195" y="0" width="205" height="32" rx="8" fill="#022c22" stroke="#059669" stroke-width="1.2" />
    <text x="209" y="21" fill="#6ee7b7" font-size="13" font-weight="600">💻 Production Open-Source</text>

    <!-- Tag 3 -->
    <rect x="415" y="0" width="195" height="32" rx="8" fill="#3b0764" stroke="#7e22ce" stroke-width="1.2" />
    <text x="429" y="21" fill="#d8b4fe" font-size="13" font-weight="600">🎯 Automated Tuning</text>

    <!-- Tag 4 -->
    <rect x="625" y="0" width="225" height="32" rx="8" fill="#172554" stroke="#2563eb" stroke-width="1.2" />
    <text x="639" y="21" fill="#93c5fd" font-size="13" font-weight="600">⚙️ Citizen Data Science</text>
  </g>

  <!-- Subtle Bottom Border Highlight -->
  <rect x="0" y="376" width="1200" height="4" fill="url(#mesh-grad)" />
</svg>
